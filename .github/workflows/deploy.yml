name: Deploy Notification Service

on:
  push:
    branches:
      - gateway
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync code
        run: |
          rsync -avz --delete \
          --mkpath \
          --no-owner --no-group --no-perms --omit-dir-times \
          --exclude '.env*' \
          --exclude '.git/' \
          --exclude '.github/' \
          -e "ssh -o StrictHostKeyChecking=no" ./ \
          ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/deploy/membership-platform/notification-service/

      - name: Build and restart notification-service
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            cd /home/deploy/membership-platform/notification-service
            docker compose build notification-service
            docker compose up -d notification-service
          EOF



